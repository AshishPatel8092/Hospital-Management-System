<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Denied — Casto Healthcare</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #3d0f0f 0%, #a01e1e 100%);
        color: #fff;
        padding: 20px;
      }
      .error-box {
        text-align: center;
        max-width: 480px;
      }
      .error-code {
        font-size: clamp(64px, 18vw, 120px);
        font-weight: 800;
        line-height: 1;
        margin: 0;
        opacity: 0.9;
      }
      .error-icon {
        font-size: 48px;
        margin-bottom: 8px;
      }
      h1 {
        font-size: clamp(18px, 4vw, 24px);
        margin: 12px 0 8px;
      }
      p {
        font-size: 14.5px;
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.6;
        margin: 0 0 28px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        padding: 12px 22px;
        border-radius: 24px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
      }
      .btn-primary {
        background: #fff;
        color: #a01e1e;
      }
      .btn-outline {
        background: transparent;
        color: #fff;
        border: 1.5px solid rgba(255, 255, 255, 0.6);
      }
      .btn:hover {
        opacity: 0.9;
      }
      @media (max-width: 400px) {
        .actions { flex-direction: column; }
        .btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="error-box">
      <div class="error-icon">🔒</div>
      <p class="error-code">403</p>
      <h1>You don't have access to this page</h1>
      <p>
        This page is restricted to a different role or requires you to be
        logged in. If you think this is a mistake, try signing in with the
        correct account.
      </p>
      <div class="actions">
        <a class="btn btn-outline" href="login.html">Sign In</a>
        <a class="btn btn-primary" href="index.html">Go to Homepage</a>
      </div>
    </div>
  </body>
</html>
