<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background:
          radial-gradient(
            circle at left,
            rgba(190, 255, 180, 0.35),
            transparent 35%
          ),
          radial-gradient(
            circle at right,
            rgba(180, 200, 255, 0.35),
            transparent 35%
          ),
          #f5f7fa;
      }

      .contact-wrapper {
        width: 100%;
        min-height: 100vh; /* Full screen height */
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
      }

      .contact-container {
        width: 100%;
        max-width: 1100px;
        background: #fff;
        border-radius: 30px;
        padding: 40px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      /* LEFT SIDE */

      .contact-left h1 {
        font-size: 48px;
        margin-bottom: 15px;
        color: #111;
      }

      .contact-left p {
        color: #555;
        line-height: 1.7;
        margin-bottom: 30px;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .info-card {
        border: 1px solid #e5e5e5;
        border-radius: 18px;
        padding: 25px;
        transition: 0.3s;
      }

      .info-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      .icon-box {
        width: 45px;
        height: 45px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
        font-size: 18px;
      }

      .blue {
        background: #eef4ff;
        color: #4d7cff;
      }

      .purple {
        background: #f2eaff;
        color: #9b6dff;
      }

      .lightblue {
        background: #edf5ff;
        color: #5d8dff;
      }

      .orange {
        background: #fff0e7;
        color: #ff8b47;
      }

      .info-card h3 {
        margin-bottom: 10px;
        color: #111;
      }

      .info-card p,
      .info-card a {
        color: #444;
        text-decoration: none;
        font-size: 15px;
      }

      /* RIGHT SIDE */

      .contact-form {
        background: #fafafa;
        padding: 25px;
        border-radius: 20px;
      }

      .form-group {
        margin-bottom: 22px;
      }

      .form-group label {
        display: block;
        margin-bottom: 10px;
        font-size: 17px;
        font-weight: 600;
        color: #333;
      }

      .form-control {
        width: 100%;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
      }

      .form-control:focus {
        border-color: #5b6df6;
      }

      textarea.form-control {
        resize: none;
        height: 140px;
      }

      .submit-btn {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(to right, #5d6ef5, #5a7cf5);
        color: white;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }

      .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(93, 110, 245, 0.3);
      }

      /* Responsive */

      @media (max-width: 992px) {
        .contact-container {
          grid-template-columns: 1fr;
        }

        .contact-left h1 {
          font-size: 40px;
        }
      }

      @media (max-width: 768px) {
        .contact-wrapper {
          padding: 20px;
        }

        .contact-container {
          padding: 25px;
        }

        .info-grid {
          grid-template-columns: 1fr;
        }

        .contact-left h1 {
          font-size: 34px;
        }
      }

      @media (max-width: 480px) {
        .contact-left h1 {
          font-size: 28px;
        }

        .form-group label {
          font-size: 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="contact-wrapper">
      <div class="contact-container">
        <!-- LEFT -->

        <div class="contact-left">
          <h1>Contact Us</h1>

          <p>
            We'll show you self-help options first. Additional help is available
            if you need it, including live chat with our specialist.
          </p>

          <div class="info-grid">
            <div class="info-card">
              <div class="icon-box blue">
                <i class="fa-solid fa-file-lines"></i>
              </div>
              <h3>Documentation</h3>
              <a href="#">castohealthcare.com/docs</a>
            </div>

            <div class="info-card">
              <div class="icon-box purple">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <h3>Our Email</h3>
              <p>support@castohealthcare.com</p>
            </div>

            <div class="info-card">
              <div class="icon-box lightblue">
                <i class="fa-solid fa-phone"></i>
              </div>
              <h3>Phone</h3>
              <p>+91 98765 43210</p>
            </div>

            <div class="info-card">
              <div class="icon-box orange">
                <i class="fa-solid fa-location-dot"></i>
              </div>
              <h3>Visit Us</h3>
              <p>Bokaro Steel City, Jharkhand, India</p>
            </div>
          </div>
        </div>

        <!-- RIGHT -->

        <div class="contact-form">
          <div class="form-group">
            <label>Full Name</label>
            <input
              type="text"
              class="form-control"
              id="contactName"
              placeholder="Full Name"
            />
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input
              type="email"
              class="form-control"
              id="contactEmail"
              placeholder="Enter your email address"
            />
          </div>

          <div class="form-group">
            <label>Phone Number (optional)</label>
            <input
              type="tel"
              class="form-control"
              id="contactPhone"
              placeholder="Enter your phone number"
            />
          </div>

          <div class="form-group">
            <label>About your inquiry</label>
            <textarea
              class="form-control"
              id="contactMessage"
              placeholder="Enter your message"
            ></textarea>
          </div>

          <button class="submit-btn" id="contactSubmitBtn">Submit</button>
        </div>
      </div>
    </div>
    <script src="api.js?v=2"></script>
    <script>
      document.getElementById("contactSubmitBtn").addEventListener("click", async () => {
        const btn = document.getElementById("contactSubmitBtn");
        const fields = {
          fullName: document.getElementById("contactName").value.trim(),
          email: document.getElementById("contactEmail").value.trim(),
          phone: document.getElementById("contactPhone").value.trim(),
          message: document.getElementById("contactMessage").value.trim(),
        };

        if (!fields.fullName || !fields.email || !fields.message) {
          alert("Please fill in your name, email, and message before submitting.");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Sending…";

        try {
          const result = await submitContactForm(fields);
          alert(
            "Thank you, " + fields.fullName + "! " + result.message
          );
          document.getElementById("contactName").value = "";
          document.getElementById("contactEmail").value = "";
          document.getElementById("contactPhone").value = "";
          document.getElementById("contactMessage").value = "";
        } catch (err) {
          alert("Something went wrong: " + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Submit";
        }
      });
    </script>
  </body>
</html>
