<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Casto Healthcare</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f3d3e 0%, #16a085 100%);
        color: #fff;
        padding: 20px;
      }
      .error-box {
        text-align: center;
        max-width: 480px;
      }
      .error-code {
        font-size: clamp(64px, 18vw, 120px);
        font-weight: 800;
        line-height: 1;
        margin: 0;
        opacity: 0.9;
      }
      .error-icon {
        font-size: 48px;
        margin-bottom: 8px;
      }
      h1 {
        font-size: clamp(18px, 4vw, 24px);
        margin: 12px 0 8px;
      }
      p {
        font-size: 14.5px;
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.6;
        margin: 0 0 28px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        padding: 12px 22px;
        border-radius: 24px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
      }
      .btn-primary {
        background: #fff;
        color: #0f3d3e;
      }
      .btn-outline {
        background: transparent;
        color: #fff;
        border: 1.5px solid rgba(255, 255, 255, 0.6);
      }
      .btn:hover {
        opacity: 0.9;
      }
      @media (max-width: 400px) {
        .actions { flex-direction: column; }
        .btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="error-box">
      <div class="error-icon">🩺</div>
      <p class="error-code">404</p>
      <h1>We couldn't find that page</h1>
      <p>
        The page you're looking for doesn't exist, may have moved, or the
        link might be mistyped. Let's get you back on track.
      </p>
      <div class="actions">
        <button class="btn btn-outline" onclick="goBack()">← Go Back</button>
        <a class="btn btn-primary" href="index.html">Go to Homepage</a>
      </div>
    </div>
    <script>
      function goBack() {
        if (document.referrer && document.referrer.includes(window.location.host)) {
          window.location.href = document.referrer;
        } else {
          window.location.href = "index.html";
        }
      }
    </script>
  </body>
</html>
